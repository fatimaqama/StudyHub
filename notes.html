<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes — StudyHub</title>
<script>
  (function () {
    try {
      var settings = JSON.parse(localStorage.getItem('studyhub_settings') || '{}');
      document.documentElement.setAttribute('data-theme', settings.theme === 'dark' ? 'dark' : 'light');
    } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    try {
      var session = JSON.parse(localStorage.getItem('studyhub_session') || sessionStorage.getItem('studyhub_session') || 'null');
      if (!session || !session.isAuthenticated) { window.location.replace('login.html'); }
    } catch (e) { window.location.replace('login.html'); }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="icon" href="assets/logos/favicon.svg" type="image/svg+xml">
<style>
  .note-card { display: flex; flex-direction: column; height: 100%; }
  .note-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .note-title { font-family: var(--font-heading); font-weight: 600; font-size: 15px; line-height: 1.35; }
  .note-content { font-size: 13.5px; color: var(--color-text-secondary); line-height: 1.55; flex: 1; margin-bottom: 14px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .note-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 12px; border-top: 1px solid var(--color-border); font-size: 12px; color: var(--color-text-muted); }
  .pin-btn { background: none; border: none; cursor: pointer; color: var(--color-text-muted); padding: 4px; flex-shrink: 0; }
  .pin-btn.pinned { color: var(--color-warning); }
  .pin-btn .icon { width: 17px; height: 17px; }
</style>
</head>
<body data-page="notes">
<a href="#main-content" class="skip-link">Skip to content</a>
<div class="app-layout">
  <aside id="sidebar" class="sidebar" aria-label="Sidebar"></aside>
  <div class="app-main">
    <header id="header" class="topbar"></header>
    <main class="page-content" id="main-content">

      <div class="toolbar">
        <div class="input-icon-wrap search-field">
          <i data-lucide="search" class="icon" aria-hidden="true"></i>
          <input class="input" type="text" id="note-search" placeholder="Search notes…">
        </div>
        <select class="input" id="note-filter-subject">
          <option value="all">All subjects</option>
        </select>
        <button type="button" class="btn btn-primary" id="add-note-btn"><i data-lucide="plus" class="icon" aria-hidden="true"></i>New note</button>
      </div>

      <section class="section" id="pinned-section">
        <div class="section-head"><h2>Pinned</h2></div>
        <div class="grid grid-cards" id="pinned-notes-grid"></div>
      </section>

      <section class="section" id="all-notes-section">
        <div class="section-head"><h2 id="all-notes-heading">All notes</h2></div>
        <div class="grid grid-cards" id="all-notes-grid"></div>
      </section>

    </main>
  </div>
</div>
<div id="app-globals"></div>

<!-- Add / edit note modal -->
<div class="modal-overlay" id="note-modal-overlay">
  <div class="modal modal-lg" role="dialog" aria-modal="true" aria-labelledby="note-modal-title">
    <div class="modal-header">
      <h3 id="note-modal-title">New note</h3>
      <button type="button" class="modal-close" id="note-modal-close" aria-label="Close"><i data-lucide="x" class="icon" aria-hidden="true"></i></button>
    </div>
    <form id="note-form">
      <div class="modal-body">
        <input type="hidden" id="note-id">
        <div class="field" id="note-title-field">
          <label for="note-title">Title</label>
          <input class="input" type="text" id="note-title" placeholder="e.g. Exam format reminder" maxlength="100">
          <p class="field-error">Give the note a title.</p>
        </div>
        <div class="field">
          <label for="note-subject">Subject</label>
          <select class="input" id="note-subject">
            <option value="">Uncategorized</option>
          </select>
        </div>
        <div class="field" id="note-content-field">
          <label for="note-content">Content</label>
          <textarea class="input" id="note-content" style="min-height:160px;" placeholder="Write your note here…"></textarea>
          <p class="field-error">Add some content to your note.</p>
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="note-pinned">
          <label for="note-pinned" style="margin:0; font-weight:500; cursor:pointer;">Pin this note to the top</label>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="note-cancel-btn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="note-save-btn">Save note</button>
      </div>
    </form>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="js/utils.js"></script>
<script src="js/storage.js"></script>
<script src="js/theme.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/notes.js"></script>
</body>
</html>
